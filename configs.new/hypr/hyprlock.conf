$font = Fira Code

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 5
}

input-field {
    monitor = DP-2
    size = 10%, 5%
    outline_thickness = 0.5
    inner_color = rgba(0, 0, 0, 0.0)

    outer_color = rgba(864491ee) rgba(33ccffee) 90deg
    check_color = rgba(00ff99ee) rgba(ff6633ee) 120deg
    fail_color = rgba(ff6633ee) rgba(ff0066ee) 40deg

    font_color = rgb(143, 143, 143)
    fade_on_empty = false
    rounding = 10

    font_family = $font
    placeholder_text = Input password...
    fail_text = $PAMFAIL$FPRINTFAIL

    check_text = Authenticating...

;     dots_text_format = *
;     dots_size = 0.5
;     dots_spacing = 0.4

    position = 100, 0
    halign = left
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME
    font_size = 100
    font_family = $font

    position = 0, 40
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y" # update every 60 seconds
    font_size = 20
    font_family = $font

    position = 0, -40
    halign = center
    valign = center
}